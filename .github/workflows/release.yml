name: Release Chart

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Package and Publish Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.2.4

      - name: Validate release
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected tag vMAJOR.MINOR.PATCH"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit is not contained in main"
            exit 1
          fi

          chart_version=$(helm show chart . | awk '/^version:/ {print $2}')
          app_version=$(helm show chart . | awk '/^appVersion:/ {print $2}')
          if [[ "$chart_version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::Chart version $chart_version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          if [[ ! "$app_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::appVersion must be a versioned CSI image tag"
            exit 1
          fi

          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Lint and test chart
        run: |
          helm lint --strict . --values tests/cases/all-protocols.yaml
          tests/render-golden.sh
          tests/schema-validation.sh

      - name: Verify application images
        run: |
          docker buildx imagetools inspect "docker.io/bfenski/nasty-csi:${{ steps.version.outputs.app_version }}"
          docker buildx imagetools inspect "ghcr.io/nasty-project/nasty-csi:${{ steps.version.outputs.app_version }}"

      - name: Package chart
        run: helm package . -d .releases

      - name: Push to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push .releases/nasty-csi-driver-${{ steps.version.outputs.chart_version }}.tgz \
            oci://ghcr.io/nasty-project/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: .releases/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
