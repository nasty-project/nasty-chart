name: Test Chart

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Lint chart
        run: helm lint . --values tests/cases/all-protocols.yaml

      - name: Compare rendered manifests
        run: tests/render-golden.sh
