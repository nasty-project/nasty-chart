name: Test Chart

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    name: Helm ${{ matrix.helm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.18.6, v4.2.4]
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}

      - name: Lint chart
        run: helm lint . --values tests/cases/all-protocols.yaml

      - name: Compare rendered manifests
        run: tests/render-golden.sh

      - name: Verify schema validation
        run: tests/schema-validation.sh
