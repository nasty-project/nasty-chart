apiVersion: {{ include "nasty-csi-driver.csidriver.apiVersion" . }}
kind: CSIDriver
metadata:
  name: {{ include "nasty-csi-driver.driverName" . }}
  labels:
    {{- include "nasty-csi-driver.labels" . | nindent 4 }}
  {{- with .Values.customAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  attachRequired: true
  podInfoOnMount: true
  storageCapacity: true
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
