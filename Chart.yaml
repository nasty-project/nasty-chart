apiVersion: v2
name: nasty-csi-driver
description: A Helm chart for NASty CSI Driver - providing NFS, NVMe-oF, and iSCSI storage for Kubernetes

# A chart can be either an 'application' or a 'library' chart.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
version: 0.0.8

# CSI application version deployed by this chart. It is independent of the
# chart version and changes only when the chart adopts another CSI release.
appVersion: "0.0.8"

keywords:
  - storage
  - csi
  - kubernetes
  - nasty
  - bcachefs
  - nfs
  - smb
  - nvmeof
  - iscsi

home: https://github.com/nasty-project/nasty-csi
sources:
  - https://github.com/nasty-project/nasty-csi

maintainers:
  - name: Bartosz Fenski
    email: fenio@debian.org
    url: https://github.com/fenio

icon: https://github.com/nasty-project/nasty-csi/raw/main/docs/nasty-logo.png
